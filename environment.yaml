# Direct dependencies at the versions this branch was validated with (Perlmutter, A100, CUDA 12).
# gpu4pyscf itself is NOT listed: install the group's fork afterwards (README, "Setup").
name: qcflow
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - openbabel=3.2.1
  - pip:
      - pyscf==2.14.0
      - pyscf-dispersion==1.5.0
      - cupy-cuda12x==14.1.1
      - cutensor-cu12==2.8.1
      - gpu4pyscf-libxc-cuda12x==0.8.1
      - geometric==1.1.1
      - sella==2.5.0
      - ase==3.29.0
      - pymatgen==2026.5.4
      - molbar==1.1.3            # pinned: molecule ids derive from its barcode format
      - pyyaml==6.0.3
      - git+https://github.com/zhongpc/mrnet.git
